<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Tap Table: lay your phone on a table and play it like a keyboard — no camera, just sound.">
  <title>Tap Table</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./tap.css">
</head>
<body>
  <main class="tap">
    <header class="tap-head">
      <h1>Tap Table</h1>
      <a class="small" href="./index.html">Camera mode →</a>
    </header>

    <section id="setup">
      <p class="lede">Lay your phone flat on a hard table. Each spot you tap sounds a little different through the wood, and the phone learns which is which. No camera needed.</p>
      <figure class="guide">
        <svg viewBox="0 0 320 110" aria-hidden="true">
          <rect x="6" y="20" width="308" height="80" rx="6" fill="currentColor" opacity=".12"/>
          <rect x="16" y="38" width="26" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="3"/>
          <g fill="currentColor"><circle cx="80" cy="61" r="7"/><circle cx="120" cy="61" r="7"/><circle cx="160" cy="61" r="7"/><circle cx="200" cy="61" r="7"/><circle cx="240" cy="61" r="7"/><circle cx="280" cy="61" r="7"/></g>
          <text x="29" y="14" text-anchor="middle" font-size="10" fill="currentColor">phone</text>
          <text x="180" y="14" text-anchor="middle" font-size="10" fill="currentColor">your spots, in a row</text>
        </svg>
        <figcaption class="small">Phone at one <b>end</b> of the row, not the middle · spots 8–15 cm apart · mark them with coins or sticky notes</figcaption>
      </figure>
      <label class="row">Number of spots
        <select id="count"><option>4</option><option selected>6</option><option>8</option></select>
      </label>
      <button id="go" class="primary">Start</button>
      <p id="status" class="status" role="status"></p>
    </section>

    <section id="stage" hidden>
      <div class="tap-info">
        <span id="mics" class="pill"></span>
        <span id="score" class="pill" hidden></span>
        <div id="meter" class="meter" title="Tap level"><span id="meterBar"></span></div>
      </div>

      <div id="prompt" class="tap-prompt" role="status"></div>
      <div id="dots" class="dots" aria-hidden="true"></div>

      <div id="keys" class="keys"></div>

      <div class="tap-actions">
        <button id="trainBtn">Retrain all</button>
        <button id="redoBtn" hidden>Redo this spot</button>
        <button id="testBtn">Accuracy test</button>
        <button id="exportBtn">Export log</button>
      </div>
      <div class="tap-settings">
        <label>Sound <select id="instrument"></select></label>
        <label>Scale <select id="scale"></select></label>
        <label>Sensitivity <input id="sens" type="range" min="2.5" max="20" step="0.5"></label>
        <label class="check"><input id="reject" type="checkbox" checked> Ignore taps that match no spot</label>
      </div>
      <pre id="log" class="tap-log"></pre>
    </section>
  </main>
  <div id="toast" class="toast" role="alert" hidden></div>
  <script type="module" src="./src/tap-main.js"></script>
</body>
</html>
